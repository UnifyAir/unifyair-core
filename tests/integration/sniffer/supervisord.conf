[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:tshark-capture]
command=tshark -i br-unifyair -f "((tcp and tcp[13] & 8 != 0) or udp or (sctp and sctp[12] == 0)) and (host 10.0.0.2 or host 10.0.0.3 or host 10.0.0.4 or host 10.0.0.5 or host 10.0.0.6 or host 10.0.0.7 or host 10.0.0.8 or host 10.0.0.9 or host 10.0.0.10 or host 10.0.0.12 or host 10.0.0.24 or host 10.0.1.0) and (not host 10.0.100.0 and not host 10.0.255.0 and not host 10.0.255.1)" -w /app/capture/traffic.pcap -b duration:30 -b packets:20 -b printname:stdout -q
directory=/app
user=root
autostart=true
autorestart=true
stdout_logfile=/app/capture/tshark.out
stderr_logfile=/dev/fd/2


[program:merged-tshark-capture]
command=tshark -i br-unifyair -f "((tcp and tcp[13] & 8 != 0) or udp or (sctp and sctp[12] == 0)) and (host 10.0.0.2 or host 10.0.0.3 or host 10.0.0.4 or host 10.0.0.5 or host 10.0.0.6 or host 10.0.0.7 or host 10.0.0.8 or host 10.0.0.9 or host 10.0.0.10 or host 10.0.0.12 or host 10.0.0.24 or host 10.0.1.0) and (not host 10.0.100.0 and not host 10.0.255.0 and not host 10.0.255.1)" -w /app/capture/merged.pcap
directory=/app
user=root
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_maxbytes=0
stderr_maxbytes=0
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0


[program:python-processor]
command=python3 -u capturer.py --mode process --tshark-out /app/capture/tshark.out
directory=/app
user=root
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_maxbytes=0
stderr_maxbytes=0
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0